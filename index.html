<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>Whiplash - Voice Controlled Duel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- p5.js Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- p5.sound.js for audio processing (FFT) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <!-- HUD Layer (Scoreboards drawn with HTML/CSS) -->
  <div class="hud" id="hudContainer" style="display: none;">
    <div class="scorebar" id="scorebarLeft">
      <img src="Sidebar L.png" alt="Left Scoreboard" class="scorebg">
      <div class="score-text score-l" id="scoreLeft">0</div>
    </div>

    <div class="scorebar" id="scorebarRight">
      <img src="Sidebar H.png" alt="Right Scoreboard" class="scorebg">
      <div class="score-text score-r" id="scoreRight">0</div>
    </div>
  </div>

  <!-- New Start Page Layout Over the Canvas -->
  <div class="start-page" id="startPage">
    <!-- Instruments (Absolute positions based on CSS) -->
    <img src="Tuba.png" alt="Tuba" class="inst-tuba">
    <img src="piano.png" alt="Piano" class="inst-piano">
    <img src="Violin.png" alt="Violin" class="inst-violin">
    <img src="Mic.png" alt="Microphone" class="inst-mic">
    <img src="Saxo.png" alt="Saxophone" class="inst-saxo">

    <!-- Center Content -->
    <div class="start-content"
      style="display: flex; flex-direction: column; align-items: center; gap: 24px; padding-bottom: 50px;">
      <img src="Group 5.png" alt="Whiplash" class="game-title" style="margin-bottom: 0;">
      <button class="start-button" id="startBtn" style="margin-top: 0;">START JAMMING</button>
    </div>
  </div>

  <script src="sketch.js"></script>
  <script>
    // Bind the start button to the existing logic inside sketch.js
    // sketch.js handles starting audio and dismissing .overlay
    // We will mimic mousePressed using an EventListener on startBtn
    document.getElementById('startBtn').addEventListener('click', function (e) {
      e.stopPropagation(); // keep it clean
      // We manually invoke the setup logic inside sketch.js
      if (typeof mousePressed === 'function') {
        mousePressed();
      }

      // Also specifically hide the startPage layout
      document.getElementById('startPage').style.display = 'none';

      // Ensure HUD shows up
      var hudEl = document.getElementById('hudContainer');
      if (hudEl) {
        hudEl.style.display = 'block';
      }

      // Ensure canvas shows up
      var canvasEl = document.getElementById('defaultCanvas0');
      if (canvasEl) {
        canvasEl.style.display = 'block';
        canvasEl.style.visibility = 'visible';
      }
    });
  </script>

  <script src="sketch.js"></script>
</body>

</html>
